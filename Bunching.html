<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TfL Analyzer">
<title>Bus Log Frequency & Bunching Analyzer</title>
<style>
:root {
color-scheme: dark;
}
html {
background-color: #121212;
margin: 0;
padding: 0;
width: 100%;
height: 100%;
-webkit-text-size-adjust: 100%;
}
body {
background-color: #121212;
color: #e0e0e0;
margin: 0;
padding: 10px;
box-sizing: border-box;
width: 100%;
min-height: 100%;
overflow-x: hidden;
font-family: Arial, sans-serif;
-webkit-user-select: text;
user-select: text;
}
h2 {
color: #ffffff;
border-bottom: 2px solid #333;
padding-bottom: 6px;
font-size: 1.1rem;
margin-top: 5px;
}
.card {
background: #1e1e1e;
border: 1px solid #333;
padding: 10px;
margin-bottom: 12px;
border-radius: 8px;
box-sizing: border-box;
width: 100%;
overflow: hidden;
}
textarea {
width: 100%;
height: 90px;
background: #2d2d2d;
color: #fff;
border: 1px solid #444;
padding: 8px;
font-family: monospace;
font-size: 11px;
border-radius: 4px;
box-sizing: border-box;
-webkit-user-select: text;
user-select: text;
-webkit-touch-callout: default;
pointer-events: auto;
}
button {
background: #d9381e;
color: white;
border: none;
padding: 8px 16px;
font-size: 14px;
cursor: pointer;
border-radius: 4px;
margin-top: 8px;
width: 100%;
box-sizing: border-box;
}
button:hover {
background: #b52e17;
}
.table-wrapper {
width: 100%;
overflow-x: auto;
-webkit-overflow-scrolling: touch;
margin-top: 8px;
}
table {
width: 100%;
border-collapse: collapse;
table-layout: auto;
}
th, td {
border: 1px solid #333;
padding: 6px 6px;
text-align: left;
font-size: 11px;
white-space: normal;
word-wrap: break-word;
}
th {
background: #252525;
color: #ffffff;
font-size: 10px;
}
.bunching {
color: #ff5252;
font-weight: bold;
}
.normal {
color: #69f0ae;
}
.curtailment {
color: #ffa726;
font-weight: bold;
}
</style>
</head>
<body>

<h2>TfL Bus Analyzer</h2>

<div class="card">
<p style="margin-top:0; font-size: 12px;">Paste log text below:</p>
<textarea id="csvData" placeholder="Paste data here..."></textarea>
<button onclick="analyzeLogs()">Analyze Frequencies</button>
</div>

<div class="card" id="resultsCard" style="display:none;">
<h2>Results</h2>
<div class="table-wrapper">
<table id="resultsTable">
<thead>
<tr>
<th>Route</th>
<th>Total Arrivals</th>
<th>Average Headway (Mins)</th>
<th>Bunching Alerts</th>
<th>Curtailments Detected</th>
</tr>
</thead>
<tbody id="resultsBody"></tbody>
</table>
</div>
</div>

<script>
const routeTerminusAliases = {
"91": ["Crouch End", "Wood Green"]
};

function normalizeDestination(dest) {
if (!dest) return "";
return dest
.replace(/[,]/g, '')
.replace(/\s+/g, ' ')
.trim()
.toLowerCase();
}

function parseRouteKey(route) {
const match = route.match(/^([A-Za-z]*)(\d+)([A-Za-z]*)$/);
if (!match) return { prefix: route, num: 0, suffix: route };
return {
prefix: match[1].toUpperCase(),
num: parseInt(match[2], 10),
suffix: match[3].toUpperCase()
};
}

function compareRoutes(a, b) {
const rA = parseRouteKey(a);
const rB = parseRouteKey(b);

if (rA.prefix !== rB.prefix) {
if (rA.prefix === '') return -1;
if (rB.prefix === '') return 1;
return rA.prefix.localeCompare(rB.prefix);
}

if (rA.num !== rB.num) {
return rA.num - rB.num;
}

return rA.suffix.localeCompare(rB.suffix);
}

function analyzeLogs() {
const raw = document.getElementById('csvData').value.trim();
if (!raw) return;

const lines = raw.split(/\r?\n/);
const routeDayLogs = {};
const routeDestinations = {};
const routeDestDisplay = {};
let totalArrivalsMap = {};

for (let line of lines) {
line = line.trim();
if (!line) continue;

const cols = line.split('\t');
if (cols.length >= 7) {
const dateStr = cols[0].trim();
const route = cols[1].trim();
const dest = cols[2].trim();
const timeStr = cols[6].trim();

if (dateStr && timeStr && route) {
const partsD = dateStr.split('/');
if (partsD.length === 3) {
const isoDate = `${partsD[2]}-${partsD[1]}-${partsD[0]}`;
const timeParts = timeStr.split(':');
let hours = 0;
if (timeParts.length >= 2) {
hours = parseInt(timeParts[0], 10);
}
let adjustedDate = isoDate;
if (hours >= 0 && hours < 5) {
const dObj = new Date(isoDate);
dObj.setDate(dObj.getDate() - 1);
adjustedDate = dObj.toISOString().split('T')[0];
}

const timestamp = new Date(`${isoDate}T${timeStr}`).getTime();

if (!isNaN(timestamp)) {
totalArrivalsMap[route] = (totalArrivalsMap[route] || 0) + 1;

if (!routeDayLogs[route]) routeDayLogs[route] = {};
if (!routeDayLogs[route][adjustedDate]) routeDayLogs[route][adjustedDate] = [];
routeDayLogs[route][adjustedDate].push(timestamp);

if (dest) {
const normDest = normalizeDestination(dest);
if (!routeDestinations[route]) routeDestinations[route] = {};
routeDestinations[route][normDest] = (routeDestinations[route][normDest] || 0) + 1;

if (!routeDestDisplay[route]) routeDestDisplay[route] = {};
if (!routeDestDisplay[route][normDest]) {
routeDestDisplay[route][normDest] = dest;
}
}
}
}
}
}
}

const resultsBody = document.getElementById('resultsBody');
resultsBody.innerHTML = '';

const sortedRoutes = Object.keys(totalArrivalsMap).sort(compareRoutes);

for (let route of sortedRoutes) {
const daysObj = routeDayLogs[route] || {};
let allIntervals = [];
let bunchCount = 0;

for (let dayKey in daysObj) {
const times = daysObj[dayKey].sort((a, b) => a - b);
for (let i = 1; i < times.length; i++) {
const diffMins = (times[i] - times[i-1]) / (1000 * 60);
if (diffMins >= 0 && diffMins < 180) {
allIntervals.push(diffMins);
if (diffMins < 3) {
bunchCount++;
}
}
}
}

const totalArrivals = totalArrivalsMap[route];
const avgHeadway = allIntervals.length > 0 ? (allIntervals.reduce((a, b) => a + b, 0) / allIntervals.length).toFixed(1) : 'N/A';

let curtailments = [];
const destCounts = routeDestinations[route] || {};
const destDisplays = routeDestDisplay[route] || {};
const aliases = routeTerminusAliases[route] || [];
const normalizedAliases = aliases.map(a => normalizeDestination(a));

if (normalizedAliases.length > 0) {
for (let normD in destCounts) {
let matchesAlias = normalizedAliases.some(alias => normD === alias || normD.includes(alias));
if (!matchesAlias) {
curtailments.push(`${destDisplays[normD]} (${destCounts[normD]})`);
}
}
} else {
let maxCount = 0;
for (let normD in destCounts) {
if (destCounts[normD] > maxCount) {
maxCount = destCounts[normD];
}
}
for (let normD in destCounts) {
if (destCounts[normD] < maxCount) {
curtailments.push(`${destDisplays[normD]} (${destCounts[normD]})`);
}
}
}

const row = document.createElement('tr');
row.innerHTML = `
<td><strong>${route}</strong></td>
<td>${totalArrivals}</td>
<td>${avgHeadway} mins</td>
<td class="${bunchCount > 0 ? 'bunching' : 'normal'}">${bunchCount > 0 ? `${bunchCount} detected` : 'None'}</td>
<td class="${curtailments.length > 0 ? 'curtailment' : 'normal'}">${curtailments.length > 0 ? curtailments.join(', ') : 'None'}</td>
`;
resultsBody.appendChild(row);
}

document.getElementById('resultsCard').style.display = 'block';
}
</script>

</body>
</html>
