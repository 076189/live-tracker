<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Bus Log Frequency & Bunching Analyzer</title>
<style>
body {
font-family: Arial, sans-serif;
background-color: #121212;
color: #e0e0e0;
margin: 0;
padding: 15px;
}
h2 {
color: #ffffff;
border-bottom: 2px solid #333;
padding-bottom: 8px;
font-size: 1.3rem;
}
.card {
background: #1e1e1e;
border: 1px solid #333;
padding: 15px;
margin-bottom: 20px;
border-radius: 8px;
}
textarea {
width: 100%;
height: 120px;
background: #2d2d2d;
color: #fff;
border: 1px solid #444;
padding: 10px;
font-family: monospace;
font-size: 13px;
border-radius: 4px;
box-sizing: border-box;
}
button {
background: #d9381e;
color: white;
border: none;
padding: 10px 20px;
font-size: 15px;
cursor: pointer;
border-radius: 4px;
margin-top: 10px;
width: 100%;
box-sizing: border-box;
}
button:hover {
background: #b52e17;
}
table {
width: 100%;
border-collapse: collapse;
margin-top: 15px;
min-width: 750px;
}
th, td {
border: 1px solid #333;
padding: 10px;
text-align: left;
font-size: 14px;
}
th {
background: #252525;
color: #ffffff;
}
.bunching {
color: #ff5252;
font-weight: bold;
}
.normal {
color: #69f0ae;
}
.curtailment {
color: #ffa726;
font-weight: bold;
}
</style>
</head>
<body>

<h2>TfL Bus Log Frequency & Bunching Analyzer</h2>

<div class="card">
<p style="margin-top:0;">Paste your tab-separated log text below:</p>
<textarea id="csvData" placeholder="Paste tab-separated data here..."></textarea>
<button onclick="analyzeLogs()">Analyze Frequencies</button>
</div>

<div class="card" id="resultsCard" style="display:none;">
<h2>Analysis Results</h2>
<div style="overflow-x:auto;">
<table id="resultsTable">
<thead>
<tr>
<th>Route</th>
<th>Total Arrivals</th>
<th>Average Headway (Mins)</th>
<th>Min Headway (Mins)</th>
<th>Max Headway (Mins)</th>
<th>Bunching Alerts (&lt;3m gaps)</th>
<th>Curtailments Detected</th>
</tr>
</thead>
<tbody id="resultsBody"></tbody>
</table>
</div>
</div>

<script>
function analyzeLogs() {
const raw = document.getElementById('csvData').value.trim();
if (!raw) return;

const lines = raw.split(/\r?\n/);
const routeLogs = {};
const routeDestinations = {};

for (let line of lines) {
line = line.trim();
if (!line) continue;

const cols = line.split('\t');
if (cols.length >= 7) {
const dateStr = cols[0].trim();
const route = cols[1].trim();
const dest = cols[2].trim();
const timeStr = cols[6].trim();

if (dateStr && timeStr && route) {
const partsD = dateStr.split('/');
if (partsD.length === 3) {
const isoDate = `${partsD[2]}-${partsD[1]}-${partsD[0]}`;
const timestamp = new Date(`${isoDate}T${timeStr}`).getTime();

if (!isNaN(timestamp)) {
if (!routeLogs[route]) routeLogs[route] = [];
routeLogs[route].push(timestamp);

if (!routeDestinations[route]) routeDestinations[route] = {};
if (dest) {
routeDestinations[route][dest] = (routeDestinations[route][dest] || 0) + 1;
}
}
}
}
}
}

const resultsBody = document.getElementById('resultsBody');
resultsBody.innerHTML = '';

for (let route in routeLogs) {
const times = routeLogs[route].sort((a, b) => a - b);
let intervals = [];
let bunchCount = 0;

for (let i = 1; i < times.length; i++) {
const diffMins = (times[i] - times[i-1]) / (1000 * 60);
if (diffMins >= 0) {
intervals.push(diffMins);
if (diffMins < 3) {
bunchCount++;
}
}
}

const totalArrivals = times.length;
const avgHeadway = intervals.length > 0 ? (intervals.reduce((a, b) => a + b, 0) / intervals.length).toFixed(1) : 'N/A';
const minHeadway = intervals.length > 0 ? Math.min(...intervals).toFixed(1) : 'N/A';
const maxHeadway = intervals.length > 0 ? Math.max(...intervals).toFixed(1) : 'N/A';

let curtailments = [];
if (routeDestinations[route]) {
const destCounts = routeDestinations[route];
const destinations = Object.keys(destCounts);

if (destinations.length > 1) {
let maxCount = 0;
for (let d in destCounts) {
if (destCounts[d] > maxCount) {
maxCount = destCounts[d];
}
}
for (let d in destCounts) {
if (destCounts[d] < maxCount) {
curtailments.push(`${d} (${destCounts[d]})`);
}
}
}
}

const row = document.createElement('tr');
row.innerHTML = `
<td><strong>${route}</strong></td>
<td>${totalArrivals}</td>
<td>${avgHeadway} mins</td>
<td>${minHeadway} mins</td>
<td>${maxHeadway} mins</td>
<td class="${bunchCount > 0 ? 'bunching' : 'normal'}">${bunchCount > 0 ? `${bunchCount} detected` : 'None'}</td>
<td class="${curtailments.length > 0 ? 'curtailment' : 'normal'}">${curtailments.length > 0 ? curtailments.join(', ') : 'None'}</td>
`;
resultsBody.appendChild(row);
}

document.getElementById('resultsCard').style.display = 'block';
}
</script>

</body>
</html>
