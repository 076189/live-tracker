<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TfL Analyzer">
<title>Bus Log Frequency & Bunching Analyzer</title>
<style>
:root { color-scheme: dark; }
html { background-color: #121212; margin: 0; padding: 0; width: 100%; height: 100%; -webkit-text-size-adjust: 100%; }
body { background-color: #121212; color: #e0e0e0; margin: 0; padding: 10px; box-sizing: border-box; width: 100%; min-height: 100%; font-family: Arial, sans-serif; }
h2 { color: #ffffff; border-bottom: 2px solid #333; padding-bottom: 6px; font-size: 1.1rem; margin-top: 5px; }
.card { background: #1e1e1e; border: 1px solid #333; padding: 10px; margin-bottom: 12px; border-radius: 8px; box-sizing: border-box; width: 100%; }
textarea { width: 100%; height: 80px; background: #2d2d2d; color: #fff; border: 1px solid #444; padding: 8px; font-family: monospace; font-size: 11px; border-radius: 4px; box-sizing: border-box; }
input[type="file"], input[type="date"], input[type="text"] { width: 100%; background: #2d2d2d; color: #fff; border: 1px solid #444; padding: 8px; font-size: 12px; border-radius: 4px; box-sizing: border-box; margin-top: 6px; }
.filter-group { display: flex; gap: 8px; margin-top: 8px; }
.filter-half { flex: 1; }
label { font-size: 11px; color: #aaa; display: block; margin-top: 6px; }
button { background: #d9381e; color: white; border: none; padding: 8px 16px; font-size: 14px; cursor: pointer; border-radius: 4px; margin-top: 10px; width: 100%; }
button:hover { background: #b52e17; }
.btn-secondary { background: #333; color: #fff; }
.btn-secondary:hover { background: #444; }
.table-wrapper { width: 100%; overflow-x: auto; margin-top: 8px; }
table { width: 100%; border-collapse: collapse; }
th, td { border: 1px solid #333; padding: 6px; text-align: left; font-size: 11px; }
th { background: #252525; color: #ffffff; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</head>
<body>

<h2>TfL Bus Analyzer</h2>
<div class="card">
<p style="margin-top:0; font-size: 12px;">Paste log text or upload Sheets file:</p>
<textarea id="csvData"></textarea>
<input type="file" id="fileInput" accept=".xlsx, .xls, .csv" onchange="handleFileUpload(event)">
<div class="filter-group">
<div class="filter-half"><label>Start Date:</label><input type="date" id="startDate"></div>
<div class="filter-half"><label>End Date:</label><input type="date" id="endDate"></div>
</div>
<label>Filter Routes (comma-separated):</label>
<input type="text" id="routeFilter" placeholder="e.g. 24, 91, N26">
<button onclick="analyzeLogs()">Analyze Frequencies</button>
</div>

<div class="card" id="resultsCard" style="display:none;">
<h2>Results</h2>
<div class="table-wrapper"><table id="resultsTable"><thead><tr><th>Route</th><th>Total</th><th>Avg Headway</th><th>Bunching</th><th>Curtailments</th></tr></thead><tbody id="resultsBody"></tbody></table></div>
<button class="btn-secondary" onclick="downloadPDF()">Download PDF Report</button>
</div>

<script>
const routeTerminusAliases = { "91": ["Crouch End", "Wood Green"] };
let analysisResultsCache = [];
let activeLogRange = "";

function handleFileUpload(event) {
const file = event.target.files[0];
const reader = new FileReader();
reader.onload = function(e) {
const data = new Uint8Array(e.target.result);
const workbook = XLSX.read(data, {type: 'array'});
document.getElementById('csvData').value = XLSX.utils.sheet_to_csv(workbook.Sheets[workbook.SheetNames[0]], {FS: "\t"});
};
reader.readAsArrayBuffer(file);
}

function analyzeLogs() {
let raw = document.getElementById('csvData').value.trim();
// Automatically fix comma-separated data to tabs for processing
if (raw.includes(',') && !raw.includes('\t')) raw = raw.replace(/,/g, '\t');

const lines = raw.split(/\r?\n/);
const startDate = document.getElementById('startDate').value;
const endDate = document.getElementById('endDate').value;
const routeFilter = document.getElementById('routeFilter').value.split(',').map(r => r.trim().toUpperCase());
const routeData = {};
const allDates = [];

lines.forEach(line => {
const cols = line.split('\t');
if (cols.length < 7) return;

const [d, r, dest, , , , t] = cols.map(c => c.trim());
const [day, m, y] = d.split('/');
const isoDate = `${y}-${m}-${day}`;

if (startDate && isoDate < startDate) return;
if (endDate && isoDate > endDate) return;
if (routeFilter[0] !== "" && !routeFilter.includes(r.toUpperCase())) return;

allDates.push(isoDate);
if (!routeData[r]) routeData[r] = { times: [], dests: {} };
routeData[r].times.push(new Date(`${isoDate}T${t}`).getTime());
routeData[r].dests[dest] = (routeData[r].dests[dest] || 0) + 1;
});

activeLogRange = allDates.length ? `${Math.min(...allDates)} to ${Math.max(...allDates)}` : "All Dates";
const resultsBody = document.getElementById('resultsBody');
resultsBody.innerHTML = '';
analysisResultsCache = [];

Object.keys(routeData).sort().forEach(r => {
const d = routeData[r];
d.times.sort((a,b) => a-b);
let intervals = [], bunch = 0;
for(let i=1; i<d.times.length; i++) {
let diff = (d.times[i]-d.times[i-1])/(60000);
if(diff < 180) { intervals.push(diff); if(diff < 3) bunch++; }
}
const curtailments = Object.keys(d.dests).filter(dest => !routeTerminusAliases[r]?.includes(dest));
const res = { route: r, total: d.times.length, headway: intervals.length ? (intervals.reduce((a,b)=>a+b,0)/intervals.length).toFixed(1) + 'm' : 'N/A', bunch: bunch || 'None', curt: curtailments.length ? curtailments : ['None'] };

analysisResultsCache.push(res);
resultsBody.innerHTML += `<tr><td><strong>${r}</strong></td><td>${res.total}</td><td>${res.headway}</td><td class="${bunch?'bunching':'normal'}">${res.bunch}</td><td class="curtailment">${res.curt.map(c=>`<li>${c}</li>`).join('')}</td></tr>`;
});
document.getElementById('resultsCard').style.display = 'block';
}

function downloadPDF() {
const { jsPDF } = window.jspdf;
const doc = new jsPDF();
doc.text(`Report: ${activeLogRange}`, 10, 10);
doc.autoTable({
startY: 20,
head: [['Route', 'Total', 'Avg', 'Bunching', 'Curtailments']],
body: analysisResultsCache.map(i => [i.route, i.total, i.headway, i.bunch, i.curt.join('\n')])
});
doc.save("report.pdf");
}
</script>
</body>
</html>
