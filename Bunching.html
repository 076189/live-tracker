<script>
let globalLogData = "";
let analysisResultsCache = [];
let logPeriodDetails = { startD: "N/A", startT: "00:00", endD: "N/A", endT: "23:59", stopName: "N/A" };
let liveFeedInterval = null;

window.addEventListener('DOMContentLoaded', () => {
loadStateFromStorage();
if (!document.getElementById('startDate').value) {
const todayStr = new Date().toISOString().split('T')[0];
document.getElementById('startDate').value = todayStr;
document.getElementById('endDate').value = todayStr;
}
if (globalLogData) {
updateRouteCheckboxes();
if (localStorage.getItem('tfl_results_visible') === 'true') {
analyzeLogs();
}
}
if (localStorage.getItem('tfl_live_active') === 'true') {
toggleLiveFeed();
}
});

function saveStateToStorage() {
localStorage.setItem('tfl_csv_data', document.getElementById('csvData').value);
localStorage.setItem('tfl_sheet_id', document.getElementById('sheetIdInput').value);
localStorage.setItem('tfl_start_date', document.getElementById('startDate').value);
localStorage.setItem('tfl_end_date', document.getElementById('endDate').value);
localStorage.setItem('tfl_time_preset', document.getElementById('timePreset').value);
localStorage.setItem('tfl_start_time', document.getElementById('startTime').value);
localStorage.setItem('tfl_end_time', document.getElementById('endTime').value);
localStorage.setItem('tfl_threshold', document.getElementById('curtailmentThreshold').value);

let savedUnchecked = [];
try {
savedUnchecked = JSON.parse(localStorage.getItem('tfl_unchecked_routes') || '[]');
} catch(e) {}
let uncheckedSet = new Set(savedUnchecked);

document.querySelectorAll('.route-chk').forEach(cb => {
if (!cb.checked) {
uncheckedSet.add(cb.value);
} else {
uncheckedSet.delete(cb.value);
}
});

localStorage.setItem('tfl_unchecked_routes', JSON.stringify(Array.from(uncheckedSet)));
}

function loadStateFromStorage() {
const csv = localStorage.getItem('tfl_csv_data');
if (csv) {
document.getElementById('csvData').value = csv;
globalLogData = csv;
}
const sheetId = localStorage.getItem('tfl_sheet_id');
if (sheetId) document.getElementById('sheetIdInput').value = sheetId;

const sd = localStorage.getItem('tfl_start_date');
if (sd) document.getElementById('startDate').value = sd;
const ed = localStorage.getItem('tfl_end_date');
if (ed) document.getElementById('endDate').value = ed;

const tp = localStorage.getItem('tfl_time_preset');
if (tp) {
document.getElementById('timePreset').value = tp;
handleTimePresetChange();
}
const st = localStorage.getItem('tfl_start_time');
if (st) document.getElementById('startTime').value = st;
const et = localStorage.getItem('tfl_end_time');
if (et) document.getElementById('endTime').value = et;

const th = localStorage.getItem('tfl_threshold');
if (th) document.getElementById('curtailmentThreshold').value = th;
}

function handleDataInput() {
updateRouteCheckboxes();
saveStateToStorage();
}

function handleStartDateChange() {
const preset = document.getElementById('timePreset').value;
const startDateVal = document.getElementById('startDate').value;

if (preset === '23:00-07:00' && startDateVal) {
let sDateObj = new Date(startDateVal);
sDateObj.setDate(sDateObj.getDate() + 1);
document.getElementById('endDate').value = sDateObj.toISOString().split('T')[0];
}
saveStateToStorage();
}

function setDateRange(type) {
const today = new Date();
const formatDate = (d) => d.toISOString().split('T')[0];
let start = new Date(today);
let end = new Date(today);

if (type === 'today') {
} else if (type === 'yesterday') {
start.setDate(today.getDate() - 1);
end.setDate(today.getDate() - 1);
} else if (type === 'last7') {
start.setDate(today.getDate() - 7);
} else if (type === 'last30') {
start.setDate(today.getDate() - 30);
}

document.getElementById('startDate').value = formatDate(start);
document.getElementById('endDate').value = formatDate(end);

const preset = document.getElementById('timePreset').value;
if (preset === '23:00-07:00' && type !== 'last7' && type !== 'last30') {
let eDateObj = new Date(end);
eDateObj.setDate(eDateObj.getDate() + 1);
document.getElementById('endDate').value = formatDate(eDateObj);
}

saveStateToStorage();
}

function handleTimePresetChange() {
const preset = document.getElementById('timePreset').value;
const customGroup = document.getElementById('customTimeGroup');
if (preset === 'CUSTOM') {
customGroup.style.display = 'table';
} else {
customGroup.style.display = 'none';
}

if (preset === '23:00-07:00') {
const startDateVal = document.getElementById('startDate').value;
if (startDateVal) {
let sDateObj = new Date(startDateVal);
sDateObj.setDate(sDateObj.getDate() + 1);
document.getElementById('endDate').value = sDateObj.toISOString().split('T')[0];
}
}

saveStateToStorage();
}

function loadPresetSheet(id) {
document.getElementById('sheetIdInput').value = id;
syncFromGoogleSheet();
}

async function syncFromGoogleSheet(isAuto = false) {
let inputVal = document.getElementById('sheetIdInput').value.trim();
if (!inputVal) {
if (!isAuto) alert("Please enter a Google Spreadsheet ID or URL.");
return;
}

let sheetId = inputVal;
const match = inputVal.match(/\/d\/([a-zA-Z0-9-_]+)/);
if (match && match[1]) {
sheetId = match[1];
}

const csvUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv&cacheBust=${new Date().getTime()}`;

try {
const response = await fetch(csvUrl);
if (!response.ok) throw new Error("Network response was not ok");
const csvText = await response.text();
document.getElementById('csvData').value = csvText;
globalLogData = csvText;
updateRouteCheckboxes();
saveStateToStorage();

if (document.getElementById('resultsCard').style.display === 'block') {
analyzeLogs();
}

if (!isAuto) {
alert("Successfully synced from Google Sheet!");
} else {
const statusEl = document.getElementById('liveStatus');
statusEl.textContent = `Live feed active (Last updated: ${new Date().toLocaleTimeString()})`;
}
} catch (error) {
if (!isAuto) {
alert("Failed to sync sheet. Ensure the spreadsheet is shared as 'Anyone with the link can view'.");
}
}
}

function toggleLiveFeed() {
const btn = document.getElementById('liveToggleBtn');
const statusEl = document.getElementById('liveStatus');
let inputVal = document.getElementById('sheetIdInput').value.trim();

if (!liveFeedInterval) {
if (!inputVal) {
alert("Please enter or select a Google Sheet URL first.");
return;
}
syncFromGoogleSheet();
liveFeedInterval = setInterval(() => {
syncFromGoogleSheet(true);
}, 30000);

btn.textContent = "Live Feed: ON";
btn.style.background = "#d9381e";
statusEl.style.display = "block";
localStorage.setItem('tfl_live_active', 'true');
} else {
clearInterval(liveFeedInterval);
liveFeedInterval = null;
btn.textContent = "Live Feed: OFF";
btn.style.background = "#333";
statusEl.style.display = "none";
localStorage.setItem('tfl_live_active', 'false');
}
}

function parseCSVLine(text) {
const separator = text.includes('\t') ? '\t' : ',';
const result = [];
let current = '';
let inQuotes = false;

for (let i = 0; i < text.length; i++) {
const char = text[i];
if (char === '"') {
inQuotes = !inQuotes;
} else if (char === separator && !inQuotes) {
result.push(current.trim());
current = '';
} else {
current += char;
}
}
result.push(current.trim());
return result.map(val => val.replace(/^["'](.*)["']$/, '$1'));
}

function normalizeDestination(dest) {
if (!dest) return "";
return dest
.replace(/[,]/g, '')
.replace(/\s+/g, ' ')
.trim()
.toLowerCase();
}

function parseRouteKey(route) {
const match = route.match(/^([A-Za-z]*)(\d+)([A-Za-z]*)$/);
if (!match) return { prefix: route, num: 0, suffix: route };
return {
prefix: match[1].toUpperCase(),
num: parseInt(match[2], 10),
suffix: match[3].toUpperCase()
};
}

function compareRoutes(a, b) {
const rA = parseRouteKey(a);
const rB = parseRouteKey(b);

if (rA.prefix !== rB.prefix) {
if (rA.prefix === '') return -1;
if (rB.prefix === '') return 1;
return rA.prefix.localeCompare(rB.prefix);
}

if (rA.num !== rB.num) {
return rA.num - rB.num;
}

return rA.suffix.localeCompare(rB.suffix);
}

function isKnown24HourRoute(r) {
const known24HourRoutes = [
"6", "12", "14", "24", "35", "36", "37", "43", "47", "52", "53", "57", "64",
"65", "68", "73", "76", "85", "88", "93", "94", "105", "108", "111", "114", "119",
"134", "139", "148", "149", "154", "158", "159", "176", "188", "189", "207", "213", "214",
"220", "222", "238", "243", "248", "253", "264", "277", "280", "281", "285",
"295", "296", "297", "344", "345", "368", "390", "436", "453", "472", "473", "474",
"C10", "D7", "E1", "U1", "W3", "W7"
];
return known24HourRoutes.includes(r);
}

function updateRouteCheckboxes() {
let raw = document.getElementById('csvData').value.trim();
if (raw) {
globalLogData = raw;
} else {
raw = globalLogData;
}

const lines = raw.split(/\r?\n/);
const routesSet = new Set();
let savedUnchecked = [];
try {
savedUnchecked = JSON.parse(localStorage.getItem('tfl_unchecked_routes') || '[]');
} catch(e) {}
const previouslyUnchecked = new Set(savedUnchecked);

for (let line of lines) {
line = line.trim();
if (!line) continue;
const cols = parseCSVLine(line);
if (cols.length >= 7) {
const route = cols[1];
if (route && route.toUpperCase() !== "ROUTE") {
routesSet.add(route.toUpperCase());
}
}
}

const container = document.getElementById('routeCheckboxesContainer');
const sortedRoutes = Array.from(routesSet).sort(compareRoutes);

if (sortedRoutes.length === 0) {
container.innerHTML = '<span style="font-size: 11px; color: #777;">Paste data or sync sheet to populate routes...</span>';
return;
}

container.innerHTML = '';
for (let route of sortedRoutes) {
const label = document.createElement('label');
label.className = 'route-checkbox-label';

const cb = document.createElement('input');
cb.type = 'checkbox';
cb.value = route;
cb.className = 'route-chk';
cb.onchange = saveStateToStorage;
cb.checked = !previouslyUnchecked.has(route);

label.appendChild(cb);
label.appendChild(document.createTextNode(route));
container.appendChild(label);
}
saveStateToStorage();
}

function toggleAllRoutes(select) {
const checkboxes = document.querySelectorAll('.route-chk');
checkboxes.forEach(cb => cb.checked = select);
saveStateToStorage();
}

function toggleRouteType(type) {
const checkboxes = document.querySelectorAll('.route-chk');
const dynamicNightRoutes = new Set();

const lines = globalLogData.split(/\r?\n/);
for (let line of lines) {
const cols = parseCSVLine(line);
if (cols.length >= 7) {
const route = cols[1] ? cols[1].trim().toUpperCase() : "";
const timeStr = cols[6] ? cols[6].trim() : "";
if (route && route !== "ROUTE" && timeStr) {
if (route.startsWith('N')) {
dynamicNightRoutes.add(route);
} else {
const timeHHMM = timeStr.length > 5 ? timeStr.substring(0, 5) : timeStr;
if ((timeHHMM >= "00:00" && timeHHMM <= "04:59") || timeHHMM.startsWith("24:") || timeHHMM.startsWith("25:")) {
dynamicNightRoutes.add(route);
}
}
}
}
}

checkboxes.forEach(cb => {
const r = cb.value;
const isNight = r.startsWith('N') || dynamicNightRoutes.has(r) || isKnown24HourRoute(r);
const isDay = !r.startsWith('N') || isKnown24HourRoute(r);

if (type === 'day') {
cb.checked = isDay;
} else if (type === 'night') {
cb.checked = isNight;
}
});
saveStateToStorage();
}

function handleFileUpload(event) {
const file = event.target.files[0];
if (!file) return;

const reader = new FileReader();
reader.onload = function(e) {
const data = new Uint8Array(e.target.result);
const workbook = XLSX.read(data, {type: 'array'});
const firstSheetName = workbook.SheetNames[0];
const worksheet = workbook.Sheets[firstSheetName];
const csvText = XLSX.utils.sheet_to_csv(worksheet);
document.getElementById('csvData').value = csvText;
globalLogData = csvText;
updateRouteCheckboxes();
};
reader.readAsArrayBuffer(file);
}

async function analyzeLogs() {
if (liveFeedInterval) {
await syncFromGoogleSheet(true);
}

let raw = document.getElementById('csvData').value.trim();
if (raw) {
globalLogData = raw;
} else {
raw = globalLogData;
}

if (!raw) return;

const startDateVal = document.getElementById('startDate').value;
const endDateVal = document.getElementById('endDate').value;
const preset = document.getElementById('timePreset').value;
const thresholdPct = (parseFloat(document.getElementById('curtailmentThreshold').value) || 45) / 100;

let filterStartT = "00:00";
let filterEndT = "23:59";
let isNightPreset = false;

if (preset === "23:00-07:00") {
isNightPreset = true;
filterStartT = "23:00";
filterEndT = "07:00";
} else if (preset === "07:00-19:00") {
filterStartT = "07:00";
filterEndT = "19:00";
} else if (preset === "19:00-23:00") {
filterStartT = "19:00";
filterEndT = "23:00";
} else if (preset === "CUSTOM") {
filterStartT = document.getElementById('startTime').value || "00:00";
filterEndT = document.getElementById('endTime').value || "23:59";
}

const selectedRoutes = new Set();
document.querySelectorAll('.route-chk:checked').forEach(cb => {
selectedRoutes.add(cb.value.toUpperCase());
});

if (selectedRoutes.size === 0) {
alert("Please select at least one route.");
return;
}

const lines = raw.split(/\r?\n/);
const routeDayLogs = {};
const routeAllDestinations = {};
const routeRecentDestinations = {};
const routeDestDisplay = {};
let totalArrivalsMap = {};
let explicitDatesSet = new Set();
let detectedStopsSet = new Set();
let routeMaxDate = {};

for (let line of lines) {
line = line.trim();
if (!line) continue;
const cols = parseCSVLine(line);
if (cols.length >= 7) {
const dateStr = cols[0];
const route = cols[1] ? cols[1].trim().toUpperCase() : "";
const timeStr = cols[6];
if (dateStr && timeStr && route && route !== "ROUTE") {
const partsD = dateStr.split('/');
if (partsD.length === 3) {
const isoDate = `${partsD[2]}-${partsD[1]}-${partsD[0]}`;
if (!routeMaxDate[route] || isoDate > routeMaxDate[route]) {
routeMaxDate[route] = isoDate;
}
}
}
}
}

for (let line of lines) {
line = line.trim();
if (!line) continue;

const cols = parseCSVLine(line);
if (cols.length >= 7) {
const dateStr = cols[0];
const route = cols[1] ? cols[1].trim().toUpperCase() : "";
const dest = cols[2];
const stopCandidate = cols[5] ? cols[5].trim() : "";
const timeStr = cols[6];

if (route === "ROUTE") continue;

if (stopCandidate && stopCandidate.toLowerCase() !== route.toLowerCase()) {
detectedStopsSet.add(stopCandidate);
}

if (dateStr && timeStr && route) {
const partsD = dateStr.split('/');
if (partsD.length === 3) {
const isoDate = `${partsD[2]}-${partsD[1]}-${partsD[0]}`;
const timeHHMM = timeStr.length > 5 ? timeStr.substring(0, 5) : timeStr;

const timePassesPreset = () => {
if (isNightPreset) {
const dateTimeStr = `${isoDate}T${timeStr}`;
if (startDateVal && endDateVal) {
const startDateTime = `${startDateVal}T23:00:00`;
const endDateTime = `${endDateVal}T07:00:00`;
if (dateTimeStr < startDateTime || dateTimeStr > endDateTime) return false;
}
if (timeHHMM < "23:00" && timeHHMM > "07:00") return false;
} else {
if (startDateVal && isoDate < startDateVal) return false;
if (endDateVal && isoDate > endDateVal) return false;
if (timeHHMM < filterStartT || timeHHMM > filterEndT) return false;
}
return true;
};

if (!selectedRoutes.has(route)) continue;

const timestamp = new Date(`${isoDate}T${timeStr}`).getTime();

if (!isNaN(timestamp)) {
const passes = timePassesPreset();

if (passes) {
explicitDatesSet.add(isoDate);
totalArrivalsMap[route] = (totalArrivalsMap[route] || 0) + 1;

if (dest) {
const normDest = normalizeDestination(dest);
if (!routeAllDestinations[route]) routeAllDestinations[route] = {};
routeAllDestinations[route][normDest] = (routeAllDestinations[route][normDest] || 0) + 1;

const maxD = new Date(routeMaxDate[route] || isoDate);
const curD = new Date(isoDate);
const diffDays = (maxD - curD) / (1000 * 60 * 60 * 24);

if (diffDays <= 7) {
if (!routeRecentDestinations[route]) routeRecentDestinations[route] = {};
routeRecentDestinations[route][normDest] = (routeRecentDestinations[route][normDest] || 0) + 1;
}

if (!routeDestDisplay[route]) routeDestDisplay[route] = {};
if (!routeDestDisplay[route][normDest]) {
routeDestDisplay[route][normDest] = dest;
}
}
}

if (!routeDayLogs[route]) routeDayLogs[route] = {};
if (!routeDayLogs[route][isoDate]) routeDayLogs[route][isoDate] = [];
routeDayLogs[route][isoDate].push({ timeStr: timeHHMM, timestamp: timestamp, passesFilter: passes });
}
}
}
}
}

let startDStr = "N/A";
let endDStr = "N/A";

if (startDateVal) {
const sParts = startDateVal.split('-');
startDStr = `${sParts[2]}/${sParts[1]}/${sParts[0]}`;
} else if (explicitDatesSet.size > 0) {
const sortedDates = Array.from(explicitDatesSet).sort();
const minParts = sortedDates[0].split('-');
startDStr = `${minParts[2]}/${minParts[1]}/${minParts[0]}`;
}

if (endDateVal) {
const eParts = endDateVal.split('-');
endDStr = `${eParts[2]}/${eParts[1]}/${eParts[0]}`;
} else if (explicitDatesSet.size > 0) {
const sortedDates = Array.from(explicitDatesSet).sort();
const maxParts = sortedDates[sortedDates.length - 1].split('-');
endDStr = `${maxParts[2]}/${maxParts[1]}/${maxParts[0]}`;
}

let loggedStopName = detectedStopsSet.size > 0 ? Array.from(detectedStopsSet).join(', ') : "Logged Location";

logPeriodDetails = {
startD: startDStr,
startT: filterStartT,
endD: endDStr,
endT: filterEndT,
stopName: loggedStopName
};

const resultsBody = document.getElementById('resultsBody');
resultsBody.innerHTML = '';
analysisResultsCache = [];

const sortedRoutes = Object.keys(totalArrivalsMap).sort(compareRoutes);

for (let route of sortedRoutes) {
const daysObj = routeDayLogs[route] || {};
let allIntervals = [];
let bunchCount = 0;

for (let dayKey in daysObj) {
const dayLogs = daysObj[dayKey].sort((a, b) => a.timestamp - b.timestamp);
const filteredLogs = dayLogs.filter(d => d.passesFilter);
const times = filteredLogs.map(d => d.timestamp);

for (let i = 1; i < times.length; i++) {
const diffMins = (times[i] - times[i-1]) / (1000 * 60);
if (diffMins >= 0 && diffMins < 180) {
allIntervals.push(diffMins);
if (diffMins < 3) {
bunchCount++;
}
}
}
}

const totalArrivals = totalArrivalsMap[route] || 0;
const avgHeadway = allIntervals.length > 0 ? (allIntervals.reduce((a, b) => a + b, 0) / allIntervals.length).toFixed(1) : 'N/A';

let reliabilityScore = 100;
if (totalArrivals > 0) {
const bunchPenalty = (bunchCount / totalArrivals) * 50;
reliabilityScore = Math.max(0, Math.min(100, Math.round(100 - bunchPenalty)));
} else {
reliabilityScore = 0;
}

const allDests = routeAllDestinations[route] || {};
const recentDests = routeRecentDestinations[route] || {};
const destDisplays = routeDestDisplay[route] || {};

let sortedRecent = Object.keys(recentDests).sort((a, b) => recentDests[b] - recentDests[a]);
let primaryNorm = sortedRecent.length > 0 ? sortedRecent[0] : "";
let primaryCount = primaryNorm ? recentDests[primaryNorm] : 0;

let topTerminuses = [primaryNorm];
for (let normD in recentDests) {
if (normD !== primaryNorm && recentDests[normD] >= (primaryCount * thresholdPct)) {
topTerminuses.push(normD);
}
}

let directionDisplay = primaryNorm ? (destDisplays[primaryNorm] || primaryNorm) : 'N/A';

let curtailmentItems = [];
let allSortedDests = Object.keys(allDests).sort((a, b) => allDests[b] - allDests[a]);

for (let normD of allSortedDests) {
let totalCount = allDests[normD];
let recentCount = recentDests[normD] || 0;
let isTop = topTerminuses.includes(normD);
let isLegacyObsolete = (recentCount === 0 && totalCount > (totalArrivals * 0.05));

if (!isTop && !isLegacyObsolete) {
curtailmentItems.push(`${destDisplays[normD]} (${recentCount > 0 ? recentCount : totalCount})`);
}
}

let curtailmentHTML = 'None';
if (curtailmentItems.length > 0) {
curtailmentHTML = '<ul style="margin:0; padding-left:14px;">' + curtailmentItems.map(item => `<li>${item}</li>`).join('') + '</ul>';
}

const bunchStr = bunchCount > 0 ? `${bunchCount} detected` : 'None';

analysisResultsCache.push({
route: route,
arrivals: totalArrivals,
headway: avgHeadway === 'N/A' ? 'N/A' : `${avgHeadway} mins`,
reliability: `${reliabilityScore}%`,
bunching: bunchStr,
curtailments: curtailmentItems,
direction: directionDisplay
});

const row = document.createElement('tr');
row.innerHTML = `
<td><strong>${route}</strong></td>
<td>${totalArrivals}</td>
<td>${avgHeadway === 'N/A' ? 'N/A' : avgHeadway + ' m'}</td>
<td class="${bunchCount > 0 ? 'bunching' : 'normal'}">${bunchStr}</td>
<td class="${curtailmentItems.length > 0 ? 'curtailment' : 'normal'}">${curtailmentHTML}</td>
`;
resultsBody.appendChild(row);
}

document.getElementById('resultsCard').style.display = 'block';
localStorage.setItem('tfl_results_visible', 'true');
}

async function downloadPDF() {
if (liveFeedInterval) {
await syncFromGoogleSheet(true);
}
await analyzeLogs();

const { jsPDF } = window.jspdf;
const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });

const pageWidth = 210;
const pageHeight = 297;

doc.setFillColor(217, 56, 30);
doc.rect(0, 0, pageWidth, 14, 'F');
doc.setTextColor(255, 255, 255);
doc.setFontSize(12);
doc.setFont("Helvetica", "bold");
doc.text("TfL Bus Log Frequency & Bunching Report", 10, 10);

doc.setTextColor(50, 50, 50);
doc.setFontSize(9);
doc.setFont("Helvetica", "normal");
doc.text(`Stop Location: ${logPeriodDetails.stopName}`, 10, 19);
doc.text(`Start: ${logPeriodDetails.startD} ${logPeriodDetails.startT}  |  End: ${logPeriodDetails.endD} ${logPeriodDetails.endT}`, 10, 24);
doc.text(`Generation Timestamp: ${new Date().toLocaleString()}`, pageWidth - 10, 20, { align: 'right' });

doc.setDrawColor(220, 220, 220);
doc.line(10, 27, pageWidth - 10, 27);

const tableData = analysisResultsCache.map(item => [
item.route,
item.arrivals,
item.headway,
item.reliability,
item.bunching,
item.curtailments.length > 0 ? item.curtailments.map(c => `• ${c}`).join('\n') : 'None',
item.direction
]);

doc.autoTable({
startY: 29,
head: [['Route', 'Total Trips', 'Average Headway', 'Reliability', 'Bunching', 'Curtailments', 'Direction']],
body: tableData,
theme: 'grid',
headStyles: { 
fillColor: [37, 37, 37], 
textColor: [255, 255, 255], 
fontStyle: 'bold',
halign: 'center',
valign: 'middle',
fontSize: 8
},
bodyStyles: { 
textColor: [40, 40, 40],
fontSize: 8,
valign: 'middle',
halign: 'left'
},
alternateRowStyles: { 
fillColor: [248, 248, 248] 
},
styles: { 
cellPadding: 2.5, 
overflow: 'linebreak',
rowPageBreak: 'avoid',
valign: 'middle',
halign: 'left'
},
columnStyles: {
0: { cellWidth: 14, halign: 'left' },
1: { cellWidth: 16, halign: 'left' },
2: { cellWidth: 24, halign: 'left' },
3: { cellWidth: 18, halign: 'left' },
4: { cellWidth: 20, halign: 'left' },
5: { cellWidth: 'auto', halign: 'left' },
6: { cellWidth: 28, halign: 'left' }
},
didDrawPage: function(data) {
doc.setFontSize(7);
doc.setTextColor(150, 150, 150);
doc.text(`Page ${doc.internal.getNumberOfPages()}`, pageWidth - 10, pageHeight - 7, { align: 'right' });
}
});

doc.save("tfl-bus-analyzer-report.pdf");
}
</script>
